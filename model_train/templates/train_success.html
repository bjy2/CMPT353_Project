<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Data Uploaded</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Automatically return to the training tab after 2 seconds
        setTimeout(function() {
            window.location.href = "/#train";
        }, 500);
    </script>
</head>
<body>
    <div class="container mt-5">
        <div class="alert alert-success">
            <h4 class="alert-heading">Training Data Uploaded Successfully</h4>
            <p>Successfully added <strong>{{ gait_state }}</strong> training data ({{ filename }})</p>
            <div class="progress mt-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
            </div>
            <p class="mt-2 mb-0">Returning to training page...</p>
        </div>
    </div>
</body>
</html>
